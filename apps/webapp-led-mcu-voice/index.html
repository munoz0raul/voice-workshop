<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="utf-8" />
        <title>Qualcomm Dragonwing · Edge AI Voice</title>
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <style>
                :root{
                        /* Qualcomm Dragonwing world — see DESIGN.md. A vertical indigo
                           gradient (lift → brand → deep) is the canvas; recognition ignites out of it. */
                        --indigo-lift:#420A96; --indigo:#31017D; --indigo-deep:#23015A;
                        --violet:#5B0CD9;              /* brand energy — glow/aura/wing only, never text (1.75:1 on canvas) */
                        --violet-glow:#AA78F5;         /* the dragon-mark atmosphere + mark halos (large/icon-legible, 4.7:1) */
                        /* Text is warm, never clinical pure white. Mist is the one violet-tinted muted. */
                        --text:#FFF0F5; --muted:#CD9BBE;   /* ink 13.3:1 · mist 6.3:1 on brand canvas */
                        /* The two projector-legible signals on the purple canvas. Ink is the
                           resting/identity cue; Amber is the one warm signal — listening + fault. */
                        --signal:#FFF0F5;
                        --amber:#FF8300;              /* 5.9:1 on canvas; reserved, never decorative */
                        --accent-rgb:91,12,217;       /* per-tile overrides below drive the recognized glow */
                        --tile-shadow:0 10px 28px rgba(0,0,0,.45);
                }
                html,body{height:100%;margin:0;color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
                        /* Vertical Dragonwing gradient, anchored on the brand primary, with a faint
                           violet bloom in the upper right where the dragon mark rises. */
                        background:radial-gradient(760px 520px at 86% 6%, rgba(170,120,245,.22), transparent 62%),
                                   linear-gradient(180deg,var(--indigo-lift) 0%, var(--indigo) 46%, var(--indigo-deep) 100%);
                        background-attachment:fixed}
                ::selection{background:rgba(170,120,245,.45);color:#fff}
                ::-webkit-scrollbar{width:10px;height:10px}
                ::-webkit-scrollbar-thumb{background:rgba(170,120,245,.6);border-radius:999px}
                ::-webkit-scrollbar-track{background:transparent}

                /* Brand atmosphere — the stylized Dragonwing wing/dragon, as background only.
                   Low-opacity identity, never a control, never as bright as live state. */
                .bg-mark{position:fixed;top:-7vh;right:-9vw;width:min(720px,58vw);height:auto;z-index:0;
                        opacity:.13;pointer-events:none;filter:blur(.5px);user-select:none}
                .bg-wave{position:fixed;inset:-48px;z-index:0;pointer-events:none;opacity:.5;
                        background:url('/assets/wave-field.png') no-repeat center bottom / cover;
                        animation:drift 30s ease-in-out infinite alternate}
                @keyframes drift{from{transform:translate3d(0,0,0)}to{transform:translate3d(-26px,-10px,0)}}

                .container{position:relative;z-index:1;max-width:1400px;margin:0 auto;padding:24px 20px;
                        min-height:100vh;display:flex;flex-direction:column;justify-content:center}

                /* Identity beacon: the Dragonwing lockup owns the top, with a soft violet halo.
                   The column is centered as a group so the lockup and partner band sit closer in. */
                .brand{display:flex;justify-content:center;margin:-16px 0 28px}
                .brand img{height:82px;width:auto;display:block;
                        filter:drop-shadow(0 3px 22px rgba(170,120,245,.40))}

                .main-content{display:flex;flex-direction:column;gap:20px;margin:0;justify-content:center;align-items:center}
                .audio-panel{width:100%;max-width:1200px}

                /* Live state — the brightest, largest region on the page. */
                .status-wrap{display:flex;flex-direction:column;align-items:center;text-align:center;margin:10px 0 34px}
                .cta{display:inline-flex;align-items:center;gap:14px;padding:12px 20px;border-radius:999px;background:rgba(255,240,245,.06);box-shadow:inset 0 0 0 1px rgba(255,240,245,.22);transition:box-shadow .25s ease, background .25s ease}
                .mic{position:relative;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:rgba(255,240,245,.10);box-shadow:inset 0 0 0 1px rgba(255,240,245,.24);transition:box-shadow .25s ease, transform .25s ease, background .25s ease}
                .mic svg{width:26px;height:26px;color:var(--signal);transition:color .25s ease}
                /* Listening = the one warm beat. Amber glyph + amber rings read across the hall
                   (5.9:1); the old near-black cue was invisible on this canvas. */
                .mic.listening{background:rgba(255,131,0,.18);transform:scale(1.06)}
                .mic.listening svg{color:var(--amber)}
                .mic.listening::before,.mic.listening::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:3px solid var(--amber);opacity:0;animation:pulse 2s ease-out infinite}
                .mic.listening::after{animation-delay:1s}
                @keyframes pulse{0%{transform:scale(.72);opacity:.95}100%{transform:scale(2.3);opacity:0}}

                .status{display:flex;align-items:center;gap:14px;font-size:48px;font-weight:800;line-height:1.05;margin:16px 0 6px;letter-spacing:.2px;color:var(--text);transition:color .25s ease}
                .wave{display:flex;gap:4px;height:30px;align-items:center}
                .bar{width:5px;height:100%;background:var(--amber);border-radius:2px;animation:bars 1.2s ease-in-out infinite}
                .bar:nth-child(2){animation-delay:.15s}.bar:nth-child(3){animation-delay:.3s}.bar:nth-child(4){animation-delay:.45s}.bar:nth-child(5){animation-delay:.6s}
                @keyframes bars{0%{transform:scaleY(.3);background:var(--amber)}50%{transform:scaleY(1);background:#FFA845}100%{transform:scaleY(.3);background:var(--amber)}}
                .wave[hidden]{display:none}

                /* Fault states — a frozen or model-less mirror must look unmistakably not-live.
                   Amber + a dimmed, desaturated grid separate it from the (lit, pulsing) listening beat. */
                .stage.offline .grid{opacity:.28;filter:grayscale(.65)}
                .stage.offline .aura{opacity:0}
                .stage.offline .cta,.stage.fault .cta{background:rgba(255,131,0,.08);box-shadow:inset 0 0 0 1px rgba(255,131,0,.5)}
                .stage.offline .mic svg,.stage.fault .mic svg{color:var(--amber)}
                .stage.offline .status,.stage.fault .status{color:var(--amber)}

                .grid-wrap{display:flex;justify-content:center;position:relative}
                /* Idle: a faint violet floor (the wing-glow). Recognition overrides it with the
                   winning tile's own color — light earned by state, not ambient decoration. */
                .aura{position:absolute;inset:-80px;z-index:0;filter:blur(60px);opacity:.22;pointer-events:none;transition:background .35s ease, opacity .35s ease;background:radial-gradient(600px 300px at 50% 40%, rgba(170,120,245,.22) 0%, transparent 55%)}
                .grid{position:relative;z-index:1;display:grid;grid-template-columns:repeat(5,150px);grid-auto-rows:150px;gap:16px;align-items:center;justify-items:center;transition:opacity .3s ease, filter .3s ease}
                /* Tiles are a passive display of device state — no pointer, no click, nothing that invites a hand. */
                .cell{width:150px;height:150px;border-radius:16px;display:flex;align-items:center;justify-content:center;box-shadow:var(--tile-shadow);border:4px solid rgba(0,0,0,.06);user-select:none;transition:box-shadow .2s ease, filter .2s ease;background-clip:padding-box;position:relative;overflow:visible}
                .cell::after{content:"";position:absolute;inset:-10px;border-radius:20px;border:3px solid rgba(255,255,255,0.18);opacity:0;transition:opacity .2s ease;pointer-events:none}
                .cell::before{content:"";position:absolute;inset:8px;border-radius:12px;opacity:0;transition:opacity .2s ease;pointer-events:none;background:radial-gradient(110px 110px at 35% 30%, rgba(var(--accent-rgb),0.35), rgba(var(--accent-rgb),0.10) 55%, rgba(var(--accent-rgb),0.0) 75%);mix-blend-mode:screen}
                .label{font-weight:800;letter-spacing:.4px;text-transform:capitalize;font-size:20px;color:#06131d}
                .blue{background:#1e90ff;--accent-rgb:30,144,255}
                .green{background:#2dd4bf;--accent-rgb:45,212,191}
                .purple{background:#9b7bff;--accent-rgb:155,123,255}
                .red{background:#ff5c6c;--accent-rgb:255,92,108}
                .yellow{background:#ffd166;--accent-rgb:255,209,102}
                /* Recognized-tile bloom: the one moment that reads from the back of the booth.
                   Zero-offset colored halo is deliberate here — it mirrors a physical glowing LED. */
                .selected{
                    box-shadow:0 24px 50px rgba(0,0,0,.55);
                    filter:saturate(1.35) brightness(1.18);
                    z-index:6;
                    border-color:rgba(255,255,255,.25);
                    isolation:isolate;
                }
                .selected::before{
                    opacity:1;
                    background:radial-gradient(120px 120px at 35% 30%, rgba(var(--accent-rgb),0.65), rgba(var(--accent-rgb),0.28) 55%, rgba(var(--accent-rgb),0.0) 75%);
                }
                .selected::after{
                    opacity:1;
                    border-color:rgba(var(--accent-rgb),.95);
                    box-shadow:
                        0 0 0 4px rgba(var(--accent-rgb),.75),
                        0 0 32px rgba(var(--accent-rgb),.90),
                        0 0 90px rgba(var(--accent-rgb),.95),
                        inset 0 0 22px rgba(var(--accent-rgb),.55);
                }

                /* Gear button — fixed bottom-right, operator-facing, invisible during demo. */
                .settings-btn{position:fixed;bottom:18px;right:18px;z-index:10;width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,240,245,.18);background:rgba(255,240,245,.06);color:var(--muted);cursor:pointer;display:grid;place-items:center;opacity:.3;transition:opacity .2s,background .2s;padding:0}
                .settings-btn:hover{opacity:1;background:rgba(255,240,245,.12)}
                .settings-btn svg{width:18px;height:18px;pointer-events:none}

                /* Modal backdrop + card */
                .settings-modal{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:rgba(35,1,90,.72);backdrop-filter:blur(6px)}
                .settings-modal[hidden]{display:none}
                .settings-card{background:linear-gradient(160deg,#420A96,#31017D);border:1px solid rgba(170,120,245,.35);border-radius:16px;padding:28px 32px;min-width:320px;max-width:480px;width:90%;box-shadow:0 24px 60px rgba(0,0,0,.6)}
                .settings-card h2{margin:0 0 20px;font-size:18px;font-weight:800;color:var(--text);display:flex;align-items:center;gap:10px}
                .settings-card h2 svg{width:18px;height:18px;color:var(--violet-glow)}
                .settings-label{font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
                .settings-select{width:100%;font-size:14px;color:var(--text);background:rgba(255,240,245,.08);border:1px solid rgba(170,120,245,.35);border-radius:8px;padding:8px 12px;cursor:pointer;outline:none;appearance:none}
                .settings-select:focus{border-color:var(--violet-glow)}
                .settings-select option{background:#31017D;color:#fff}
                .settings-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}
                .settings-actions button{font-size:13px;font-weight:700;padding:8px 20px;border-radius:8px;cursor:pointer;border:none}
                .btn-cancel{background:rgba(255,240,245,.08);color:var(--muted)}
                .btn-cancel:hover{background:rgba(255,240,245,.14)}
                .btn-save{background:var(--violet-glow);color:#1a0040}
                .btn-save:hover{filter:brightness(1.1)}

                /* Partner logos: a quiet footer band — supporting Dragonwing, never the brightest object. */
                .partners{display:flex;justify-content:center;margin:18px auto 0}
                .partners .logos{display:flex;justify-content:center;align-items:center;gap:28px;flex-wrap:wrap;background:#fff;border-radius:12px;padding:12px 26px;box-shadow:0 2px 12px rgba(0,0,0,.28);max-width:900px}
                .partners .logo{text-align:center;padding:4px 10px}
                .partners .logo img{max-height:48px;object-fit:contain;display:block}
                .partners .logo img[src="foundries.png"]{max-height:58px}   /* its own art carries extra whitespace */

                @media (max-width:920px){
                        .grid{grid-template-columns:repeat(5,110px);grid-auto-rows:110px}.cell{width:110px;height:110px}
                        .status{font-size:38px}.brand img{height:66px}
                }
                @media (max-width:700px){.status{font-size:30px}.cell .label{font-size:16px}.brand img{height:52px}}
                @media (prefers-reduced-motion:reduce){.bar,.mic.listening::before,.mic.listening::after,.bg-wave{animation:none}}
        </style>
</head>
<body>
    <img class="bg-mark" src="/assets/dragon-mark.png" alt="" aria-hidden="true" onerror="this.style.display='none'"/>
    <div class="bg-wave" aria-hidden="true"></div>

    <!-- Gear button — operator-facing mic settings, invisible during demo -->
    <button class="settings-btn" id="settingsBtn" aria-label="Microphone settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
    </button>

    <!-- Mic settings modal -->
    <div class="settings-modal" id="settingsModal" hidden>
        <div class="settings-card">
            <h2>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                    <line x1="12" y1="19" x2="12" y2="22"/>
                </svg>
                Microphone
            </h2>
            <div class="settings-label">Capture device</div>
            <select class="settings-select" id="deviceSelect">
                <option value="">auto (use default)</option>
            </select>
            <div style="font-size:11px;color:var(--muted);margin-top:8px;opacity:.75">✓ = resamples to 16 kHz; raw hw: devices need hardware support</div>
            <div class="settings-actions">
                <button class="btn-cancel" id="cancelBtn">Cancel</button>
                <button class="btn-save" id="saveBtn">Save &amp; apply</button>
            </div>
        </div>
    </div>

    <div class="container">
        <header class="brand">
            <img src="/assets/dragonwing-logo.png" alt="Qualcomm Dragonwing" onerror="this.style.display='none'"/>
        </header>

        <div id="stage" class="main-content stage">
            <div class="audio-panel">
                <div class="status-wrap" role="status" aria-live="polite">
                    <div class="cta">
                        <div id="mic" class="mic" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
                                <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                                <line x1="12" y1="19" x2="12" y2="22"/>
                            </svg>
                        </div>
                        <div class="status">
                            <span id="statusText">Say "Select" to start</span>
                            <span id="wave" class="wave" aria-hidden="true" hidden>
                                <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
                            </span>
                        </div>
                    </div>
                </div>

                <div class="grid-wrap">
                    <div id="aura" class="aura"></div>
                    <div id="colorGrid" class="grid" role="list" aria-label="Recognizable colors">
                        <div class="cell blue" data-color="blue" role="listitem" aria-label="Blue"><span class="label">Blue</span></div>
                        <div class="cell green" data-color="green" role="listitem" aria-label="Green"><span class="label">Green</span></div>
                        <div class="cell purple" data-color="purple" role="listitem" aria-label="Purple"><span class="label">Purple</span></div>
                        <div class="cell red" data-color="red" role="listitem" aria-label="Red"><span class="label">Red</span></div>
                        <div class="cell yellow" data-color="yellow" role="listitem" aria-label="Yellow"><span class="label">Yellow</span></div>
                    </div>
                </div>
            </div>
        </div>

        <footer class="partners">
            <div class="logos" aria-hidden="true">
                <div class="logo"><img src="arduino.png" alt="Arduino" onerror="this.style.opacity=.5;this.style.filter='grayscale(70%)'"/></div>
                <div class="logo"><img src="edgeimpulse.png" alt="Edge Impulse" onerror="this.style.opacity=.5;this.style.filter='grayscale(70%)'"/></div>
                <div class="logo"><img src="foundries.png" alt="Foundries.io" onerror="this.style.opacity=.5;this.style.filter='grayscale(70%)'"/></div>
                <div class="logo"><img src="qualcomm.png" alt="Qualcomm" onerror="this.style.opacity=.5;this.style.filter='grayscale(70%)'"/></div>
            </div>
        </footer>
    </div>

    <script>
        (function () {
            const stageEl = document.getElementById('stage');
            const statusTextEl = document.getElementById('statusText');
            const waveEl = document.getElementById('wave');
            const micEl = document.getElementById('mic');
            const auraEl = document.getElementById('aura');
            let selectedCell = null;
            let currentSelectedColor = '';

            const COLORS = {
                blue:'#1e90ff', green:'#2dd4bf', purple:'#9b7bff',
                red:'#ff5c6c', yellow:'#ffd166'
            };

            // mode: 'live' (idle/ready), 'listening', 'fault' (device reachable, model error),
            // 'offline' (SSE stream dropped — the mirror is no longer live).
            function setMode(mode){
                const listening = mode === 'listening';
                stageEl.classList.toggle('offline', mode === 'offline');
                stageEl.classList.toggle('fault', mode === 'fault');
                micEl.classList.toggle('listening', listening);
                waveEl.hidden = !listening;
            }

            function clearSelection(){
                if(selectedCell){
                    selectedCell.classList.remove('selected');
                    selectedCell = null;
                }
                currentSelectedColor = '';
            }

            function highlightColor(color){
                if(!color){ clearSelection(); return; }
                if (currentSelectedColor === color && selectedCell) return;
                clearSelection();
                const el = document.querySelector(`.cell[data-color="${color}"]`);
                if(!el) return;
                el.classList.add('selected');
                selectedCell = el;
                currentSelectedColor = color;
                const c = COLORS[color] || 'var(--signal)';
                auraEl.style.background = `radial-gradient(520px 280px at 50% 40%, ${c}33 0%, transparent 55%)`;
                auraEl.style.opacity = '.35';
                setTimeout(()=> auraEl.style.opacity = '.22', 600);
            }

            function reflectStatus(s){
                if(!s) return;
                const lower = s.toLowerCase();
                statusTextEl.textContent = s;
                if (lower.includes('not found') || lower.includes('error')) { setMode('fault'); return; }
                setMode(lower.includes('select the color') ? 'listening' : 'live');
            }

            // Gear button / mic settings modal
            const settingsBtn = document.getElementById('settingsBtn');
            const settingsModal = document.getElementById('settingsModal');
            const deviceSelect = document.getElementById('deviceSelect');
            const saveBtn = document.getElementById('saveBtn');
            const cancelBtn = document.getElementById('cancelBtn');

            settingsBtn.addEventListener('click', () => {
                // Populate dropdown fresh on each open
                deviceSelect.innerHTML = '<option value="">auto (use default)</option>';
                fetch('/devices').then(r => r.json()).then(({devices, current}) => {
                    devices.forEach(d => {
                        const opt = document.createElement('option');
                        opt.value = d.id;
                        opt.textContent = d.recommended ? `${d.name}  ✓` : d.name;
                        if (d.id === current) opt.selected = true;
                        deviceSelect.appendChild(opt);
                    });
                }).catch(() => {});
                settingsModal.hidden = false;
            });

            cancelBtn.addEventListener('click', () => { settingsModal.hidden = true; });
            settingsModal.addEventListener('click', e => { if (e.target === settingsModal) settingsModal.hidden = true; });

            saveBtn.addEventListener('click', () => {
                const val = deviceSelect.value;
                const id = val === '' ? null : parseInt(val, 10);
                saveBtn.textContent = 'Applying…';
                saveBtn.disabled = true;
                fetch('/device', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id})})
                    .then(() => { settingsModal.hidden = true; })
                    .catch(() => { settingsModal.hidden = true; })
                    .finally(() => { saveBtn.textContent = 'Save & apply'; saveBtn.disabled = false; });
            });

            const es = new EventSource('/status');
            es.onopen = () => { stageEl.classList.remove('offline'); };
            es.onmessage = (evt) => {
                stageEl.classList.remove('offline');
                let data;
                try { data = JSON.parse(evt.data); }
                catch(e){ return; }
                reflectStatus(data.status || '');
                if (data.color === '') clearSelection();
                else if (data.color) highlightColor(data.color);
            };
            // A dropped stream is the worst mid-demo failure: the mirror freezes while the
            // presenter keeps talking. Make it loud. EventSource auto-reconnects; onopen clears it.
            es.onerror = () => {
                setMode('offline');
                statusTextEl.textContent = 'Reconnecting to device…';
            };
        })();
    </script>
</body>
</html>
